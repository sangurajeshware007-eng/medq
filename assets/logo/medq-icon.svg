<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MedQ+">
  <title>MedQ+</title>
  <!-- Token circle -->
  <circle cx="32" cy="32" r="26" fill="#0D9488"/>
  <!-- Medical plus -->
  <rect x="28.5" y="15" width="7" height="34" rx="2.5" fill="#FFFFFF"/>
  <rect x="15" y="28.5" width="34" height="7" rx="2.5" fill="#FFFFFF"/>
  <!-- Q-tail: turns the circle into a Q, hints at forward motion -->
  <path d="M 50 48 Q 58 52 60 60" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</svg>
