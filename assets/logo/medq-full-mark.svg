<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-label="MedQ+ — Connecting Health Care to Every Corner of India">
  <title>MedQ+</title>
  <defs>
    <!-- Globe gradient: ocean blue with a soft highlight -->
    <radialGradient id="globe" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#E6F4FA"/>
      <stop offset="55%" stop-color="#5BB8E8"/>
      <stop offset="100%" stop-color="#0A72A0"/>
    </radialGradient>
    <!-- Soft ground shadow below the globe -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ───────────── Compass arrows (N / E / S / W) ───────────── -->
  <!-- Labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#B83A2B">
    <text x="260" y="46" font-size="36" text-anchor="middle">N</text>
    <text x="260" y="620" font-size="36" text-anchor="middle">S</text>
    <text x="482" y="302" font-size="36">E</text>
    <text x="22"  y="302" font-size="36">W</text>
  </g>
  <!-- Arrow shafts + heads, red -->
  <g fill="#D13B2A" stroke="#D13B2A" stroke-width="5" stroke-linecap="round">
    <!-- North -->
    <line x1="260" y1="116" x2="260" y2="66"/>
    <polygon points="260,54 248,78 272,78" stroke="none"/>
    <!-- South -->
    <line x1="260" y1="524" x2="260" y2="574"/>
    <polygon points="260,586 248,562 272,562" stroke="none"/>
    <!-- East -->
    <line x1="444" y1="312" x2="472" y2="312"/>
    <polygon points="484,312 460,300 460,324" stroke="none"/>
    <!-- West -->
    <line x1="76"  y1="312" x2="48"  y2="312"/>
    <polygon points="36,312 60,300 60,324" stroke="none"/>
  </g>

  <!-- ───────────── Orbit arcs (dashed, wrapping the globe) ───────────── -->
  <g fill="none" stroke="#0A6F8A" stroke-width="4" stroke-linecap="round">
    <!-- Top-left orbit -->
    <path d="M 110 220 A 180 180 0 0 1 260 116" stroke-dasharray="10 10"/>
    <!-- Top-right orbit -->
    <path d="M 260 116 A 180 180 0 0 1 410 220" stroke-dasharray="10 10"/>
    <!-- Bottom-right orbit -->
    <path d="M 430 340 A 180 180 0 0 1 260 524"/>
    <polygon points="260,524 280,510 280,538" fill="#0A6F8A" stroke="none"/>
    <!-- Bottom-left orbit -->
    <path d="M 260 524 A 180 180 0 0 1 90 340"/>
    <polygon points="90,340 104,320 120,332" fill="#0A6F8A" stroke="none"/>
  </g>

  <!-- ───────────── Ground shadow ───────────── -->
  <ellipse cx="260" cy="500" rx="140" ry="18" fill="url(#shadow)"/>

  <!-- ───────────── Globe ───────────── -->
  <g>
    <!-- Main sphere -->
    <circle cx="260" cy="312" r="166" fill="url(#globe)" stroke="#0A6F8A" stroke-width="2"/>
    <!-- Meridian (vertical ellipse) -->
    <ellipse cx="260" cy="312" rx="50" ry="166" fill="none" stroke="#0A6F8A" stroke-width="1.2" opacity="0.55"/>
    <!-- Equator (horizontal ellipse) -->
    <ellipse cx="260" cy="312" rx="166" ry="42" fill="none" stroke="#0A6F8A" stroke-width="1.2" opacity="0.55"/>
    <!-- Tropic of Cancer / Capricorn (thin) -->
    <ellipse cx="260" cy="258" rx="155" ry="30" fill="none" stroke="#0A6F8A" stroke-width="0.9" opacity="0.35"/>
    <ellipse cx="260" cy="366" rx="155" ry="30" fill="none" stroke="#0A6F8A" stroke-width="0.9" opacity="0.35"/>

    <!-- India silhouette (emerald), positioned in the upper-right of the visible hemisphere -->
    <!-- Hand-drawn path approximating the subcontinent's outline -->
    <g transform="translate(228 232) scale(0.72)" fill="#148F6C" stroke="#0C6A50" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 28 4
               C 44 6 60 10 76 20
               C 88 28 96 38 102 50
               C 108 62 112 76 118 92
               C 124 108 132 122 138 138
               C 142 152 138 168 128 180
               C 120 190 110 196 102 210
               C 96 222 94 238 88 252
               C 82 264 72 272 62 276
               C 56 282 54 294 52 306
               C 48 316 42 322 34 326
               L 30 330
               L 28 336
               L 28 328
               C 22 318 16 308 12 296
               C 6 280 4 262 8 246
               C 12 230 22 218 30 204
               C 34 192 34 178 28 166
               C 20 152 10 142 4 128
               C 0 116 0 102 6 90
               C 12 76 22 64 30 52
               C 34 42 32 28 28 18
               Z"/>
      <!-- Sri Lanka (small island to the south) -->
      <ellipse cx="56" cy="348" rx="8" ry="12"/>
    </g>
  </g>

  <!-- ───────────── Tagline ───────────── -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0A5870">
    <text x="260" y="568" font-size="34" font-weight="700" text-anchor="middle">Connecting Health Care</text>
    <text x="260" y="602" font-size="20" font-style="italic" text-anchor="middle" letter-spacing="0.5">— to Every Corner of India —</text>
  </g>
</svg>
